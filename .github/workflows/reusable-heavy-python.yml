name: Reusable heavy Python analysis

"on":
  workflow_call:
    inputs:
      python_version:
        description: Python version for hosted heavy analysis
        required: false
        type: string
        default: "3.11"
      requirements_file:
        description: Caller-owned hash-pinned heavy-analysis lock
        required: false
        type: string
        default: "requirements/ci-heavy.txt"
      analysis_endpoint:
        description: Caller-owned heavy analysis script path
        required: false
        type: string
        default: "tools/ci/heavy-python"

permissions:
  contents: read

jobs:
  heavy-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate caller heavy-analysis contract
        env:
          REQUIREMENTS_FILE: ${{ inputs.requirements_file }}
          ANALYSIS_ENDPOINT: ${{ inputs.analysis_endpoint }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$REQUIREMENTS_FILE" || {
            echo "missing heavy-analysis lock: $REQUIREMENTS_FILE" >&2
            exit 2
          }
          test -f "$ANALYSIS_ENDPOINT" || {
            echo "missing heavy-analysis endpoint: $ANALYSIS_ENDPOINT" >&2
            exit 2
          }

      - name: Record verification identity
        shell: bash
        env:
          VERIFICATION_PROFILE: heavy-python
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          if [ "$checkout_sha" != "$SOURCE_SHA" ]; then
            printf 'QA_SOURCE_MISMATCH expected=%s observed=%s\n' "$SOURCE_SHA" "$checkout_sha" >&2
            exit 2
          fi
          printf 'verification_profile=%s\n' "$VERIFICATION_PROFILE"
          printf 'verification_event_repository=%s\n' "$EVENT_REPOSITORY"
          printf 'verification_event_sha=%s\n' "$EVENT_SHA"
          printf 'verification_source_repository=%s\n' "$SOURCE_REPOSITORY"
          printf 'verification_source_sha=%s\n' "$SOURCE_SHA"
          printf 'verification_checkout_sha=%s\n' "$checkout_sha"
          printf 'verification_run_id=%s\n' "$RUN_ID"
          printf 'verification_run_attempt=%s\n' "$RUN_ATTEMPT"
          printf 'verification_caller_workflow_ref=%s\n' "$CALLER_WORKFLOW_REF"
          printf 'verification_caller_workflow_sha=%s\n' "$CALLER_WORKFLOW_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip
          cache-dependency-path: ${{ inputs.requirements_file }}

      - name: Install caller-pinned analysis tools
        env:
          REQUIREMENTS_FILE: ${{ inputs.requirements_file }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes -r "$REQUIREMENTS_FILE"

      - name: Run caller heavy-analysis endpoint
        env:
          ANALYSIS_ENDPOINT: ${{ inputs.analysis_endpoint }}
        shell: bash
        run: |
          set -euo pipefail
          started="$(date +%s)"

          emit_resource_snapshot() {
            label="$1"
            now="$(date +%s)"
            ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            mem_available_kib="$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)"
            root_free_kib="$(df -Pk / | awk 'NR == 2 {print $4}')"
            printf '%s ts=%s elapsed_seconds=%s mem_available_kib=%s root_free_kib=%s\n' \
              "$label" "$ts" "$((now - started))" "$mem_available_kib" "$root_free_kib"
          }

          heartbeat() {
            while true; do
              sleep 60
              emit_resource_snapshot heavy_python_heartbeat
            done
          }

          emit_resource_snapshot heavy_python_resource_baseline
          heartbeat &
          heartbeat_pid=$!
          cleanup_heartbeat() {
            kill "$heartbeat_pid" 2>/dev/null || true
            wait "$heartbeat_pid" 2>/dev/null || true
          }
          trap cleanup_heartbeat EXIT
          trap 'cleanup_heartbeat; exit 130' INT
          trap 'cleanup_heartbeat; exit 143' TERM

          set +e
          bash "$ANALYSIS_ENDPOINT"
          code=$?
          set -e

          cleanup_heartbeat
          trap - EXIT INT TERM
          emit_resource_snapshot heavy_python_resource_final
          exit "$code"
