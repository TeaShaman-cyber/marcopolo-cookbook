name: Reusable dependency security

"on":
  workflow_call:
    inputs:
      python_version:
        description: Python version for dependency-security tooling
        required: false
        type: string
        default: "3.11"
      inputs_file:
        description: Caller-owned dependency-security input manifest
        required: false
        type: string
        default: "config/dependency-security.inputs"

permissions:
  contents: read

jobs:
  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout caller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record verification identity
        shell: bash
        env:
          VERIFICATION_PROFILE: dependency-security
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          if [ "$checkout_sha" != "$SOURCE_SHA" ]; then
            printf 'QA_SOURCE_MISMATCH expected=%s observed=%s\n' "$SOURCE_SHA" "$checkout_sha" >&2
            exit 2
          fi
          printf 'verification_profile=%s\n' "$VERIFICATION_PROFILE"
          printf 'verification_event_repository=%s\n' "$EVENT_REPOSITORY"
          printf 'verification_event_sha=%s\n' "$EVENT_SHA"
          printf 'verification_source_repository=%s\n' "$SOURCE_REPOSITORY"
          printf 'verification_source_sha=%s\n' "$SOURCE_SHA"
          printf 'verification_checkout_sha=%s\n' "$checkout_sha"
          printf 'verification_run_id=%s\n' "$RUN_ID"
          printf 'verification_run_attempt=%s\n' "$RUN_ATTEMPT"
          printf 'verification_caller_workflow_ref=%s\n' "$CALLER_WORKFLOW_REF"
          printf 'verification_caller_workflow_sha=%s\n' "$CALLER_WORKFLOW_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ inputs.python_version }}

      - name: Validate caller dependency inputs
        env:
          DEPENDENCY_INPUTS: ${{ inputs.inputs_file }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$DEPENDENCY_INPUTS" || {
            echo "missing dependency-security inputs: $DEPENDENCY_INPUTS" >&2
            exit 2
          }

      - name: Run shared dependency-security witness
        uses: TeaShaman-cyber/marcopolo-cookbook/.github/actions/dependency-security@28ca86bf93a80e37361f171f32080892be8c6ba8
        with:
          inputs-file: ${{ inputs.inputs_file }}
          receipt-path: ${{ runner.temp }}/dependency-security-receipt.json

      - name: Emit dependency-security receipt
        if: always()
        env:
          DEPENDENCY_SECURITY_RECEIPT: ${{ runner.temp }}/dependency-security-receipt.json
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$DEPENDENCY_SECURITY_RECEIPT" ]; then
            printf '%s\n' '--- dependency-security receipt ---'
            cat "$DEPENDENCY_SECURITY_RECEIPT"
          else
            echo 'DEPENDENCY_SECURITY_RECEIPT_MISSING' >&2
            exit 4
          fi
