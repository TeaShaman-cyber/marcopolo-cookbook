name: Reusable canonical QA

"on":
  workflow_call:
    inputs:
      python_version:
        description: Python version available to the repository QA endpoint
        required: false
        type: string
        default: "3.11"
      qa_endpoint:
        description: Repository-owned canonical QA script path
        required: false
        type: string
        default: "tools/dev/check"

permissions:
  contents: read

jobs:
  canonical-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python_version: ${{ inputs.python_version }}

      - name: Validate caller canonical QA contract
        env:
          QA_ENDPOINT: ${{ inputs.qa_endpoint }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$QA_ENDPOINT" || {
            echo "missing canonical QA endpoint: $QA_ENDPOINT" >&2
            exit 2
          }

      - name: Run caller canonical QA endpoint
        env:
          QA_ENDPOINT: ${{ inputs.qa_endpoint }}
        shell: bash
        run: |
          set -euo pipefail
          bash "$QA_ENDPOINT"
