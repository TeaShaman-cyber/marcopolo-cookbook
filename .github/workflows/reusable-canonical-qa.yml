name: Reusable canonical QA

"on":
  workflow_call:
    inputs:
      python_version:
        description: Python version available to the repository QA endpoint
        required: false
        type: string
        default: "3.11"
      qa_endpoint:
        description: Repository-owned canonical QA script path
        required: false
        type: string
        default: "tools/dev/check"

permissions:
  contents: read

jobs:
  canonical-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record verification identity
        shell: bash
        env:
          VERIFICATION_PROFILE: canonical-qa
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          printf 'verification_profile=%s\n' "$VERIFICATION_PROFILE"
          printf 'verification_repository=%s\n' "$CALLER_REPOSITORY"
          printf 'verification_sha=%s\n' "$CALLER_SHA"
          printf 'verification_run_id=%s\n' "$RUN_ID"
          printf 'verification_run_attempt=%s\n' "$RUN_ATTEMPT"
          printf 'verification_workflow_ref=%s\n' "$WORKFLOW_REF"
          printf 'verification_workflow_sha=%s\n' "$WORKFLOW_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ inputs.python_version }}

      - name: Validate caller canonical QA contract
        env:
          QA_ENDPOINT: ${{ inputs.qa_endpoint }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$QA_ENDPOINT" || {
            echo "missing canonical QA endpoint: $QA_ENDPOINT" >&2
            exit 2
          }

      - name: Run caller canonical QA endpoint
        env:
          QA_ENDPOINT: ${{ inputs.qa_endpoint }}
        shell: bash
        run: |
          set -euo pipefail
          bash "$QA_ENDPOINT"
