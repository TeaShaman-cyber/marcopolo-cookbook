name: Reusable property test

"on":
  workflow_call:
    inputs:
      python_version:
        description: Python version for caller-owned property tests
        required: false
        type: string
        default: "3.11"
      requirements_file:
        description: Caller-owned hash-pinned property-test lock
        required: false
        type: string
        default: "requirements/ci-property.txt"
      property_endpoint:
        description: Caller-owned property-test endpoint
        required: false
        type: string
        default: "tools/ci/property-test"

permissions:
  contents: read

jobs:
  property-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate caller property-test contract
        env:
          REQUIREMENTS_FILE: ${{ inputs.requirements_file }}
          PROPERTY_ENDPOINT: ${{ inputs.property_endpoint }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$REQUIREMENTS_FILE" || {
            echo "missing property-test lock: $REQUIREMENTS_FILE" >&2
            exit 2
          }
          test -f "$PROPERTY_ENDPOINT" || {
            echo "missing property-test endpoint: $PROPERTY_ENDPOINT" >&2
            exit 2
          }

      - name: Record verification identity
        shell: bash
        env:
          VERIFICATION_PROFILE: property-test
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          if [ "$checkout_sha" != "$SOURCE_SHA" ]; then
            printf 'QA_SOURCE_MISMATCH expected=%s observed=%s\n' "$SOURCE_SHA" "$checkout_sha" >&2
            exit 2
          fi
          printf 'verification_profile=%s\n' "$VERIFICATION_PROFILE"
          printf 'verification_event_repository=%s\n' "$EVENT_REPOSITORY"
          printf 'verification_event_sha=%s\n' "$EVENT_SHA"
          printf 'verification_source_repository=%s\n' "$SOURCE_REPOSITORY"
          printf 'verification_source_sha=%s\n' "$SOURCE_SHA"
          printf 'verification_checkout_sha=%s\n' "$checkout_sha"
          printf 'verification_run_id=%s\n' "$RUN_ID"
          printf 'verification_run_attempt=%s\n' "$RUN_ATTEMPT"
          printf 'verification_caller_workflow_ref=%s\n' "$CALLER_WORKFLOW_REF"
          printf 'verification_caller_workflow_sha=%s\n' "$CALLER_WORKFLOW_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip
          cache-dependency-path: ${{ inputs.requirements_file }}

      - name: Install caller-pinned property tools
        env:
          REQUIREMENTS_FILE: ${{ inputs.requirements_file }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes -r "$REQUIREMENTS_FILE"

      - name: Run caller property-test endpoint
        env:
          PROPERTY_ENDPOINT: ${{ inputs.property_endpoint }}
        shell: bash
        run: |
          set -euo pipefail
          started="$(date +%s)"
          set +e
          bash "$PROPERTY_ENDPOINT"
          code=$?
          set -e
          finished="$(date +%s)"
          printf 'PROPERTY_TEST_RUNTIME seconds=%s exit=%s\n' "$((finished - started))" "$code"
          exit "$code"
